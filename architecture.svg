<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a45"/><stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122b2a"/><stop offset="1" stop-color="#0f2230"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#5ad1c8"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#7b8aa8"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1c2a44" stroke-width="1" opacity="0.5">
    <path d="M0 60H1200M0 140H1200M0 220H1200M0 300H1200M0 380H1200M0 460H1200M0 540H1200M0 620H1200M0 700H1200M0 780H1200"/>
  </g>

  <!-- title -->
  <text x="48" y="52" fill="#eaf2ff" font-size="27" font-weight="700" letter-spacing=".5">EXOFS · The Ghost Machine</text>
  <text x="48" y="78" fill="#7f93b5" font-size="14">No local disk. A computer assembled entirely from other people's computers.</text>
  <text x="1152" y="52" fill="#5ad1c8" font-size="12" text-anchor="end" font-weight="600">T−0 DOCTRINE</text>
  <text x="1152" y="72" fill="#4a5a78" font-size="11" text-anchor="end">free tier · public internet · zero installs</text>

  <!-- ================= CLIENT ================= -->
  <g>
    <rect x="48" y="112" width="250" height="336" rx="14" fill="url(#client)" stroke="#2c4066"/>
    <text x="68" y="142" fill="#9fb4d8" font-size="11" font-weight="700" letter-spacing="1.6">T0 · THE BROWSER = THE OS</text>
    <text x="68" y="166" fill="#eaf2ff" font-size="15" font-weight="700">Ephemeral client</text>
    <text x="68" y="186" fill="#6d82a6" font-size="11.5">RAM only · reboot = factory reset</text>

    <g>
      <rect x="68" y="204" width="210" height="42" rx="7" fill="#0e1729" stroke="#28405f"/>
      <text x="80" y="222" fill="#cfe0f5" font-size="12" font-weight="600">Pyodide / WebContainers</text>
      <text x="80" y="237" fill="#6d82a6" font-size="10.5">Python + Node, in a tab</text>
    </g>
    <g>
      <rect x="68" y="254" width="210" height="42" rx="7" fill="#0e1729" stroke="#28405f"/>
      <text x="80" y="272" fill="#cfe0f5" font-size="12" font-weight="600">FFmpeg.wasm · sql.js</text>
      <text x="80" y="287" fill="#6d82a6" font-size="10.5">media + SQL without a disk</text>
    </g>
    <g>
      <rect x="68" y="304" width="210" height="42" rx="7" fill="#0e1729" stroke="#28405f"/>
      <text x="80" y="322" fill="#cfe0f5" font-size="12" font-weight="600">libsodium / age (WASM)</text>
      <text x="80" y="337" fill="#6d82a6" font-size="10.5">encrypt BEFORE upload</text>
    </g>
    <g>
      <rect x="68" y="354" width="210" height="42" rx="7" fill="#0e1729" stroke="#28405f"/>
      <text x="80" y="372" fill="#cfe0f5" font-size="12" font-weight="600">SHA-256 verify</text>
      <text x="80" y="387" fill="#6d82a6" font-size="10.5">every brick, every read</text>
    </g>
    <text x="68" y="428" fill="#5ad1c8" font-size="11" font-weight="600">Rule: a save is a round-trip.</text>
    <text x="68" y="444" fill="#4f6284" font-size="10.5">no acknowledgment = no write</text>
  </g>


  <!-- loss ledger -->
  <g>
    <rect x="48" y="466" width="298" height="286" rx="14" fill="#0c1420" stroke="#2b2036"/>
    <text x="68" y="492" fill="#f08aae" font-size="10.5" font-weight="700" letter-spacing="1.4">DELETED AT T−0</text>
    <g font-size="11.5" fill="#b9a3b0">
      <text x="68" y="516">durable writes</text>
      <text x="68" y="538">local installs</text>
      <text x="68" y="560">caches &amp; build dirs</text>
      <text x="68" y="582">.git working copies</text>
      <text x="68" y="604">MOLT working copies</text>
    </g>
    <text x="68" y="638" fill="#7de0a2" font-size="10.5" font-weight="700" letter-spacing="1.4">SURVIVED</text>
    <g font-size="11.5" fill="#8fbfa8">
      <text x="68" y="660">compute</text>
      <text x="68" y="682">RAM, until reboot</text>
      <text x="68" y="704">the network</text>
      <text x="68" y="726">every server on earth</text>
    </g>
  </g>

  <!-- transport arrows -->
  <g stroke="#5ad1c8" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M298 232 H372"/>
  </g>
  <text x="335" y="222" fill="#7fd8d1" font-size="10" text-anchor="middle">HTTPS</text>
  <g stroke="#5ad1c8" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.9">
    <path d="M372 330 H298" />
  </g>
  <text x="335" y="322" fill="#7fd8d1" font-size="10" text-anchor="middle">CDN</text>
  <text x="335" y="352" fill="#4a5a78" font-size="9.5" text-anchor="middle">jsDelivr</text>
  <text x="335" y="364" fill="#4a5a78" font-size="9.5" text-anchor="middle">cache-forever</text>

  <!-- ================= FABRIC ================= -->
  <g>
    <rect x="372" y="112" width="780" height="620" rx="16" fill="url(#fabric)" stroke="#255049"/>
    <text x="396" y="142" fill="#5ad1c8" font-size="11" font-weight="700" letter-spacing="1.6">THE FABRIC · UNAFFECTED SERVERS</text>
    <text x="1128" y="142" fill="#3f6b64" font-size="11" text-anchor="end">four independent layers, three custodians each</text>

    <!-- L4 identity -->
    <g>
      <rect x="396" y="160" width="732" height="58" rx="9" fill="#0c1a24" stroke="#2b6b6b"/>
      <text x="412" y="180" fill="#7fd8d1" font-size="10" font-weight="700" letter-spacing="1.2">L4 · IDENTITY</text>
      <text x="412" y="199" fill="#cfe0f5" font-size="12" font-weight="600">passkeys · OAuth · Shamir 3-of-5 key shares · two recovery identities</text>
      <text x="1112" y="199" fill="#6d82a6" font-size="10.5" text-anchor="end">key custody ≠ data custody</text>
    </g>

    <!-- L3 state -->
    <g>
      <rect x="396" y="228" width="732" height="72" rx="9" fill="#0c1a24" stroke="#2b6b6b"/>
      <text x="412" y="248" fill="#7fd8d1" font-size="10" font-weight="700" letter-spacing="1.2">L3 · STATE</text>
      <g font-size="11" fill="#a9bcd8">
        <rect x="412" y="258" width="168" height="30" rx="6" fill="#132434" stroke="#28505a"/>
        <text x="426" y="277" fill="#cfe0f5">manifests in git</text>
        <rect x="590" y="258" width="168" height="30" rx="6" fill="#132434" stroke="#28505a"/>
        <text x="604" y="277" fill="#cfe0f5">D1 / KV · catalog</text>
        <rect x="768" y="258" width="168" height="30" rx="6" fill="#132434" stroke="#28505a"/>
        <text x="782" y="277" fill="#cfe0f5">Sheets / Notion index</text>
        <rect x="946" y="258" width="166" height="30" rx="6" fill="#132434" stroke="#28505a"/>
        <text x="960" y="277" fill="#cfe0f5">CRDT · append log</text>
      </g>
    </g>

    <!-- L2 compute -->
    <g>
      <rect x="396" y="310" width="732" height="96" rx="9" fill="#0c1a24" stroke="#2b6b6b"/>
      <text x="412" y="330" fill="#7fd8d1" font-size="10" font-weight="700" letter-spacing="1.2">L2 · COMPUTE</text>
      <rect x="412" y="340" width="168" height="52" rx="6" fill="#132434" stroke="#28505a"/>
      <text x="426" y="359" fill="#eaf2ff" font-size="11.5" font-weight="600">Edge · Workers</text>
      <text x="426" y="375" fill="#6d82a6" font-size="10">100k req/day</text>

      <rect x="590" y="340" width="168" height="52" rx="6" fill="#132434" stroke="#5ad1c8" stroke-width="1.4"/>
      <text x="604" y="359" fill="#eaf2ff" font-size="11.5" font-weight="600">CI runners ⚡</text>
      <text x="604" y="375" fill="#7fd8d1" font-size="10">4 vCPU / 16 GB · free, unlimited</text>

      <rect x="768" y="340" width="168" height="52" rx="6" fill="#132434" stroke="#28505a"/>
      <text x="782" y="359" fill="#eaf2ff" font-size="11.5" font-weight="600">Codespaces / Colab</text>
      <text x="782" y="375" fill="#6d82a6" font-size="10">120 core-hrs · GPU</text>

      <rect x="946" y="340" width="166" height="52" rx="6" fill="#132434" stroke="#28505a"/>
      <text x="960" y="359" fill="#eaf2ff" font-size="11.5" font-weight="600">perchance / StackBlitz</text>
      <text x="960" y="375" fill="#6d82a6" font-size="10">an app whose source is a URL</text>
    </g>

    <!-- L1 storage tiers -->
    <g>
      <rect x="396" y="416" width="732" height="190" rx="9" fill="#0c1a24" stroke="#2b6b6b"/>
      <text x="412" y="436" fill="#7fd8d1" font-size="10" font-weight="700" letter-spacing="1.2">L1 · STORAGE — HOT / WARM / COLD</text>

      <rect x="412" y="448" width="230" height="66" rx="7" fill="#1b1a10" stroke="#8a6d2f"/>
      <text x="426" y="468" fill="#f2c96b" font-size="11" font-weight="700">HOT · Cloudflare R2</text>
      <text x="426" y="486" fill="#a99a76" font-size="10">10 GB · 1M/10M ops · egress free</text>
      <text x="426" y="503" fill="#7d7259" font-size="10">live working set of the app</text>

      <rect x="656" y="448" width="230" height="66" rx="7" fill="#101f18" stroke="#2f7a52"/>
      <text x="670" y="468" fill="#7de0a2" font-size="11" font-weight="700">WARM · git + Releases</text>
      <text x="670" y="486" fill="#8fae9d" font-size="10">manifests, code, 2 GiB assets</text>
      <text x="670" y="503" fill="#68806f" font-size="10">every clone = a full replica</text>

      <rect x="900" y="448" width="212" height="66" rx="7" fill="#191022" stroke="#6b3f8a"/>
      <text x="914" y="468" fill="#c9a2e8" font-size="11" font-weight="700">COLD · HF / Archive</text>
      <text x="914" y="486" fill="#a08ab5" font-size="10">public storage, best-effort</text>
      <text x="914" y="503" fill="#7a658a" font-size="10">the tier with a mission</text>

      <!-- brick illustration -->
      <text x="412" y="538" fill="#6d82a6" font-size="10.5">BRICK — a 4 MiB content-addressed, encrypted chunk. No lane has a size limit that 4 MiB can't pass.</text>
      <g>
        <rect x="412" y="548" width="46" height="22" rx="4" fill="#2a3a55" stroke="#4c668f"/><text x="435" y="563" fill="#9fb4d8" font-size="9" text-anchor="middle">9f2c…</text>
        <rect x="464" y="548" width="46" height="22" rx="4" fill="#2a3a55" stroke="#4c668f"/><text x="487" y="563" fill="#9fb4d8" font-size="9" text-anchor="middle">a71b…</text>
        <rect x="516" y="548" width="46" height="22" rx="4" fill="#2a3a55" stroke="#4c668f"/><text x="539" y="563" fill="#9fb4d8" font-size="9" text-anchor="middle">3e0d…</text>
        <rect x="568" y="548" width="46" height="22" rx="4" fill="#20293c" stroke="#3a4c6b" stroke-dasharray="3 3"/><text x="591" y="563" fill="#5c6d8a" font-size="9" text-anchor="middle">?</text>
        <text x="624" y="563" fill="#5c6d8a" font-size="10">one missing brick = 4 MiB lost, not a file. repair by cron.</text>
      </g>
      <text x="412" y="592" fill="#4f6284" font-size="10">manifest.json → {name, size, bricks[]} → committed as a diffable, human-readable contract.</text>
    </g>

    <!-- failure paths -->
    <g>
      <rect x="396" y="620" width="732" height="94" rx="9" fill="#150f16" stroke="#6b2f4a"/>
      <text x="412" y="640" fill="#f08aae" font-size="10" font-weight="700" letter-spacing="1.2">FAILURE PATHS — the system degrades, it does not die</text>
      <text x="412" y="660" fill="#c9aebc" font-size="11">GitHub down → jsDelivr serves cached bricks</text>
      <text x="700" y="660" fill="#c9aebc" font-size="11">· account banned → R2 + HF copies survive</text>
      <text x="412" y="680" fill="#c9aebc" font-size="11">Cloudflare down → raw.githubusercontent serves</text>
      <text x="700" y="680" fill="#c9aebc" font-size="11">· everything down → manifests still are a plan</text>
      <text x="412" y="702" fill="#8d7280" font-size="10.5">No master copy exists. A hash every copy must match is stronger than a master copy — if someone proves it.</text>
    </g>
  </g>

  <!-- bottom band -->
  <text x="48" y="782" fill="#5ad1c8" font-size="12" font-weight="700">MOLT · 60 minutes, ordered by value density per megabyte</text>
  <text x="1152" y="782" fill="#3f4f6b" font-size="10" text-anchor="end">a manifest at T−10 beats a file at T−0.5</text>
  <g font-size="10.5" fill="#8ea3c2">
    <text x="48" y="806">T−60 · TRIAGE</text>
    <text x="196" y="806">T−40 · TEXT FIRST: keys → docs → code</text>
    <text x="512" y="806">T−20 · CHUNK + FAN OUT 3 LANES</text>
    <text x="800" y="806">T−5 · VERIFY ROUND-TRIP</text>
    <text x="1010" y="806">T+0 · RESTORE DRILL</text>
  </g>
  <path d="M48 818 H1152" stroke="#22314c" stroke-width="2"/>
  <g fill="#5ad1c8">
    <circle cx="48" cy="818" r="4"/><circle cx="196" cy="818" r="4"/><circle cx="512" cy="818" r="4"/><circle cx="800" cy="818" r="4"/><circle cx="1010" cy="818" r="4"/>
  </g>
  </svg>
